aid: stonly
name: Stonly
description: >-
  Stonly is a knowledge management and customer self-service platform that lets
  organizations create interactive step-by-step guides, decision trees, and
  structured knowledge content for both customer self-service and agent-assisted
  support. It combines a knowledge base, an embeddable widget, AI chatbots and
  agent-assist, and process automation, and integrates with customer service
  tools such as Zendesk, Salesforce, ServiceNow, Freshdesk, Zapier, Segment and
  HubSpot. For developers Stonly ships native mobile SDKs (iOS, Android, React
  Native) plus a CLI to embed guides in apps, and a REST/HTTP API for managing
  knowledge content and syncing user data. Companies including RemoteLock,
  Devialet and Tonal use Stonly to deflect support tickets, speed up resolution,
  and streamline agent onboarding.
